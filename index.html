<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Stat</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--p:#111114;--b:#26262b;--t:#f2f2f4;--m:#9a9aa3;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 Inter,system-ui,sans-serif;padding:12px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hd b{font-size:16px}.hd small{display:block;color:var(--m)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.card{border:1px solid var(--b);border-radius:10px;padding:10px 12px;background:#0d0d10;cursor:default}
.card b{display:block}.card span{font-weight:700}.z{color:var(--r)}.p{color:var(--g)}
.pc{cursor:pointer}.pc.on{outline:2px solid #fff}
.badge{background:#ef4444;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:6px}
.badge.up{background:#16a34a}
input,select,button{background:#0d0d10;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 12px;font:inherit}
button{cursor:pointer}button:hover{background:#1a1a1f}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6aa7ff}
button.del{background:#7f1d1d;border-color:#7f1d1d}button:disabled{opacity:.4;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar .sp{flex:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:500;cursor:pointer}
tbody tr:hover{background:#17171b;cursor:pointer}td.l,th.l{text-align:left}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--r)}.dot.up{background:var(--g)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}.box{background:var(--p);border:1px solid var(--b);border-radius:14px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;padding:16px}
.list{overflow:auto;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--b)}
.row span:first-child{color:var(--m);word-break:break-all}
</style></head><body>
<div class="grid">
  <section class="panel"><div class="hd"><div><b>Item Monitor</b><small id="itSub"></small></div></div><div class="cards" id="items"></div></section>
  <section class="panel"><div class="hd"><div><b>PC Monitor</b><small id="pcSub"></small></div></div><div class="cards" id="pcs"></div></section>
</div>
<section class="panel">
  <div class="bar">
    <input id="q" placeholder="Tìm tài khoản, PC, item…" style="min-width:220px">
    <select id="pcSel"></select>
    <select id="stSel"><option value="">Tất cả trạng thái</option><option value="on">Online</option><option value="off">Offline</option></select>
    <span class="sp"></span>
    <button id="copy">Copy script</button>
    <button id="del" class="del" disabled>Xóa</button>
  </div>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</section>
<div class="modal" id="md"><div class="box">
  <div class="hd"><div><b id="mt"></b><small id="ms"></small></div><button id="mc">Đóng</button></div>
  <input id="mq" placeholder="Lọc toàn bộ item / giá trị đã quét…"><div class="list" id="ml"></div>
</div></div>
<script>
// Điền tên map theo PlaceId nếu muốn, ví dụ {1234567:'Lobby', 7654321:'Trận'}
const PLACES={};
const ONLINE_MS=90000;
const M=[ // [tên cột, regex khớp tên, regex loại trừ, kiểu gộp]
 ['Level',/^level$/i,0,'max'],['Gems',/^gem_amount$/i],['Gold',/^gold_amount$/i],
 ['Summer Pearls',/summerpearls/i],['Reroll',/^reroll_stat/i],['Token Reroll',/^trait_reroll_tokens$/i],
 ['Star Remnant',/star.*remnant/i,/limit/i],['Star Remnant Limited',/star.*remnant.*limit|limit.*star.*remnant/i]];
let S={now:Date.now(),accounts:[]},pcF='',sel=new Set(),sortK='seen',sortD=-1,open=null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>typeof v==='number'?v.toLocaleString('en-US'):esc(v);
const up=a=>S.now-a.seen<ONLINE_MS;
function entries(a){const o=[];for(const[k,v]of Object.entries(a.flat||{}))o.push([k,v]);for(const[k,v]of Object.entries(a.items||{}))o.push(['Item.'+k,v]);return o}
function metric(a,m){
  if(!a._m){const best={};for(const[k,v]of entries(a)){if(typeof v!=='number')continue;const n=k.split(/[.@]/).pop();best[n]=Math.max(best[n]??-Infinity,v)}a._m=best}
  const[,re,ex,mode]=m;let r=0;
  for(const[n,v]of Object.entries(a._m)){if(re.test(n)&&!(ex&&ex.test(n)))r=mode==='max'?Math.max(r,v):r+v}
  return r}
function ago(t){const s=Math.max(0,(S.now-t)/1000|0);return s<60?s+'s':s<3600?(s/60|0)+'m':s<86400?(s/3600|0)+'h':(s/86400|0)+' ngày'}
function view(){
  const q=$('q').value.toLowerCase(),st=$('stSel').value;
  return S.accounts.filter(a=>(!pcF||a.pc===pcF)&&(!st||(st==='on')===up(a))&&(!q||(a.user+' '+a.pc+' '+entries(a).map(e=>e[0]).join(' ')).toLowerCase().includes(q)))
   .sort((x,y)=>{const f=a=>sortK==='seen'?a.seen:sortK==='user'||sortK==='pc'?a[sortK]:sortK==='st'?+up(a):metric(a,M[+sortK]);const A=f(x),B=f(y);return(A>B?1:A<B?-1:0)*sortD})}
function render(){
  S.accounts.forEach(a=>delete a._m);
  const pcs={};S.accounts.forEach(a=>{(pcs[a.pc]??={on:0,off:0})[up(a)?'on':'off']++});
  $('pcSub').textContent=Object.keys(pcs).length+' PC · '+S.accounts.length+' tài khoản';
  $('pcs').innerHTML=Object.entries(pcs).map(([n,c])=>`<div class="card pc ${pcF===n?'on':''}" data-pc="${esc(n)}"><span class="badge ${c.on?'up':''}">${c.on?'Online':'Offline'}</span><b>${esc(n)}</b><small style="color:var(--m)">${c.on+c.off} tài khoản</small><div><span class="p">▲ ${c.on}</span> &nbsp; <span class="z">▼ ${c.off}</span></div></div>`).join('')||'<small>Chưa có PC nào gửi data.</small>';
  const cur=$('pcSel').value;$('pcSel').innerHTML='<option value="">Tất cả PC</option>'+Object.keys(pcs).map(p=>`<option ${p===pcF?'selected':''}>${esc(p)}</option>`).join('');
  const list=view();
  $('itSub').textContent=M.length+' mục · '+list.length+' tài khoản đang lọc';
  $('items').innerHTML=M.map((m,i)=>{const t=list.reduce((s,a)=>m[3]==='max'?Math.max(s,metric(a,m)):s+metric(a,m),0);return`<div class="card"><b>${m[0]}${m[3]==='max'?' (cao nhất)':''}</b><span class="${t?'p':'z'}">${t.toLocaleString('en-US')}</span></div>`}).join('');
  const h=(k,t,l)=>`<th data-k="${k}" class="${l?'l':''}">${t}${sortK==k?(sortD>0?' ↑':' ↓'):''}</th>`;
  $('th').innerHTML='<tr><th><input type="checkbox" id="all"></th>'+h('st','Trạng thái',1)+h('user','Username',1)+h('pc','PC')+'<th>Map</th>'+M.map((m,i)=>h(i,m[0])).join('')+'<th>Items</th></tr>';
  $('all').checked=list.length&&list.every(a=>sel.has(a.user));
  $('tb').innerHTML=list.map(a=>`<tr data-u="${esc(a.user)}"><td><input type="checkbox" class="ck" ${sel.has(a.user)?'checked':''}></td><td class="l"><i class="dot ${up(a)?'up':''}"></i>${up(a)?'Online':ago(a.seen)}</td><td class="l">${esc(a.user)}</td><td>${esc(a.pc)}</td><td>${esc(PLACES[a.place]||a.place||'-')}</td>${M.map(m=>{const v=metric(a,m);return`<td class="${v?'':'z'}">${v.toLocaleString('en-US')}</td>`}).join('')}<td>${entries(a).length}</td></tr>`).join('')||`<tr><td colspan="${M.length+6}" style="color:var(--m);padding:28px">Chưa có tài khoản. Chạy script trong executor để gửi data về.</td></tr>`;
  $('del').disabled=!sel.size;$('del').textContent=sel.size?`Xóa (${sel.size})`:'Xóa';
  if(open)detail();
}
function detail(){
  const a=S.accounts.find(x=>x.user===open);if(!a)return;
  $('mt').textContent=a.user;$('ms').textContent=`${a.pc} · cập nhật ${ago(a.seen)} trước · ${entries(a).length} giá trị`;
  const f=$('mq').value.toLowerCase();
  $('ml').innerHTML=entries(a).filter(e=>!f||e[0].toLowerCase().includes(f)).sort((x,y)=>x[0].localeCompare(y[0])).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${num(v)}</span></div>`).join('')||'<small>Không có dữ liệu.</small>';
}
async function load(){try{S=await(await fetch('/api/state')).json()}catch{}render()}
document.addEventListener('click',e=>{
  const t=e.target,pc=t.closest('[data-pc]'),th=t.closest('th[data-k]'),tr=t.closest('tr[data-u]');
  if(pc){pcF=pcF===pc.dataset.pc?'':pc.dataset.pc;render()}
  else if(th){const k=th.dataset.k;sortD=sortK==k?-sortD:-1;sortK=k;render()}
  else if(t.id==='all'){view().forEach(a=>t.checked?sel.add(a.user):sel.delete(a.user));render()}
  else if(t.classList.contains('ck')){const u=tr.dataset.u;t.checked?sel.add(u):sel.delete(u);render()}
  else if(tr){open=tr.dataset.u;$('mq').value='';$('md').classList.add('on');detail()}
  else if(t.id==='mc'||t.id==='md'){open=null;$('md').classList.remove('on')}
});
$('pcSel').onchange=e=>{pcF=e.target.value;render()};$('stSel').onchange=$('q').oninput=render;$('mq').oninput=detail;
$('del').onclick=async()=>{if(!confirm('Xóa '+sel.size+' tài khoản?'))return;await fetch('/api/delete',{method:'POST',body:JSON.stringify({users:[...sel]})});sel.clear();load()};
$('copy').onclick=()=>{navigator.clipboard.writeText(`getgenv().Track_Settings = {\n    ['key'] = 'KEY_CỦA_BẠN',\n    ['PC'] = 'CHANGE-ME',\n}\ntask.spawn(function() loadstring(game:HttpGet('${location.origin}/main.lua'))() end)`);$('copy').textContent='Đã copy';setTimeout(()=>$('copy').textContent='Copy script',1500)};
load();setInterval(load,5000);
</script></body></html>
